<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Mobility Admin</title><style>[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#263c30;font:15px system-ui}header{padding:22px 5%;background:#304e3c;color:white;display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{max-width:1200px;margin:30px auto;padding:0 20px}.panel{background:white;border:1px solid #e3e5df;border-radius:14px;padding:22px;margin-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:21px}input,button{padding:10px;border:1px solid #ccd5cc;border-radius:7px;font:inherit}button{cursor:pointer;background:#304e3c;color:white}input{max-width:100%}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stats strong{display:block;font-size:29px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}td input{width:95px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}#message{padding:12px;min-height:45px}form{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:6px}.danger{background:#964b40}small{color:#68776b}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}header{gap:15px;flex-wrap:wrap}}
</style><header><h1>Smart Mobility · Admin</h1><a href="/" id="backLink">User Portal</a></header><main><div id="message" role="status" aria-live="polite"></div><section class="panel" id="login"><h2>Admin login</h2><p>Use the administrator account configured when starting the server.</p><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button>Log in</button></form></section><div id="dashboard" hidden><div class="stats" id="stats"></div><nav><button onclick="show('vehicles')">Vehicles</button><button onclick="show('bookings')">Bookings</button><button onclick="show('users')">Users</button><button onclick="show('rides')">Shared rides</button><button onclick="logout()">Log out</button></nav><section class="panel"><h2 id="heading"></h2><div id="vehicleTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px" hidden></div><div class="scroll" id="content"></div></section></div></main><dialog id="rideDetailsDialog" style="max-width:600px;border:1px solid #ddd;border-radius:14px;padding:24px"><h2>Shared Ride Details</h2><div id="rideDetailsContent"></div><button onclick="$('rideDetailsDialog').close()">Close</button></dialog><script>
const embedded=new URLSearchParams(location.search).get('embedded')==='1';if(embedded){document.querySelector('header').hidden=true;document.getElementById('backLink').onclick=e=>{e.preventDefault();parent.switchPortal('user')}}
const $=id=>document.getElementById(id);let data={},tab='vehicles',vehicleFilter='All';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(s){$('message').textContent=s}
async function api(path,body){const r=await fetch(path,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{data=await api('/api/admin/dashboard');$('login').hidden=true;$('dashboard').hidden=false;$('stats').innerHTML=['vehicles','bookings','users','rides'].map(k=>`<div class="panel"><strong>${data[k].length}</strong>${k==='rides'?'Shared rides':esc(k)}</div>`).join('');show(tab);message('Dashboard updated')}catch(e){message(e.message)}}
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function show(value){tab=value;$('vehicleTabs').hidden=tab!=='vehicles';$('vehicleTabs').innerHTML=[['All','All'],['Car','Cars'],['Bike','Bikes'],['Scooter','Scooters'],['Electric','Electric']].map(([k,label])=>`<button aria-pressed="${vehicleFilter===k}" style="opacity:${vehicleFilter===k?1:.65}" onclick="filterVehicles('${k}')">${label}</button>`).join('');$('heading').textContent={vehicles:'Vehicle pricing and availability',bookings:'All bookings',users:'Registered users',rides:'Shared rides'}[tab];let rows=[];
if(tab==='vehicles'){rows=data.vehicles.map((v,i)=>({v,i})).filter(({v})=>vehicleFilter==='All'||v.kind===vehicleFilter||(vehicleFilter==='Electric'&&v.fuel==='Electric')).map(({v,i})=>`<tr><td>${esc(v.name)}</td><td>${esc(v.kind)}</td><td><input id="price-${i}" aria-label="Daily price for ${esc(v.name)}" type="number" min="1" max="100000" value="${v.price}"></td><td><input id="stock-${i}" aria-label="Stock for ${esc(v.name)}" type="number" min="0" max="1000" value="${v.stock}"></td><td><button onclick="saveVehicle(${i})">Save</button></td></tr>`);$('content').innerHTML=table(['Vehicle','Type','₹ / day','Stock','Action'],rows)}
if(tab==='bookings'){rows=data.bookings.map((b,i)=>`<tr><td>${esc(b.id)}</td><td>${esc(b.name)}<br><small>${esc(b.email)}</small></td><td>${esc(b.vehicle)}</td><td>${esc(b.start)} → ${esc(b.end)}</td><td>₹${esc(b.total)}<br>${esc(b.payment)}</td><td>${esc(b.status)}</td><td>${b.status==='Pending'?`<button onclick="acceptBooking(${i})">Accept</button> `:''}${b.status==='Cancelled'?'—':`<button class="danger" onclick="cancelBooking(${i})">Cancel</button>`}</td></tr>`);$('content').innerHTML=table(['ID','Customer','Vehicle','Dates','Payment','Status','Action'],rows)}
if(tab==='users'){rows=data.users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.admin?'Admin':u.blocked?'Disabled':'Active'}</td><td>${u.admin?'—':`<button onclick="toggleUser(${i})">${u.blocked?'Enable':'Disable'}</button> <button class="danger" onclick="deleteUser(${i})">Delete</button>`}</td></tr>`);$('content').innerHTML=table(['Name','Email','Account','Action'],rows)}
if(tab==='rides'){rows=data.rides.map((r,i)=>`<tr><td>${esc(r.driver)}</td><td>${esc(r.from)} → ${esc(r.to)}</td><td>${esc(r.date)}</td><td>${esc(r.seats)}</td><td>₹${esc(r.cost)}</td><td><button onclick="rideDetails(${r.id})">Details</button> <button class="danger" onclick="deleteRide(${i})">Delete</button></td></tr>`);$('content').innerHTML=table(['Driver','Route','Date','Seats left','Price','Action'],rows)}
if(!rows.length)$('content').innerHTML='<p>No records yet.</p>'}
async function action(path,body){try{const r=await api('/api/admin/'+path,body);await load();message(r.message)}catch(e){message(e.message)}}
function filterVehicles(k){vehicleFilter=k;show('vehicles')}
function acceptBooking(i){if(confirm('Accept this booking and allow payment?'))action('accept-booking',{id:data.bookings[i].id})}
function saveVehicle(i){action('vehicle',{id:data.vehicles[i].id,price:Number($('price-'+i).value),stock:Number($('stock-'+i).value)})}
function cancelBooking(i){if(confirm('Cancel this booking?'))action('cancel-booking',{id:data.bookings[i].id})}
function deleteUser(i){const u=data.users[i];if(confirm('Permanently delete '+u.name+' ('+u.email+')? This ends login sessions, cancels bookings, removes offered rides and releases reserved seats.'))action('delete-user',{id:u.id})}
function toggleUser(i){const u=data.users[i];if(confirm((u.blocked?'Enable':'Disable')+' this account?'))action('user',{id:u.id,blocked:!u.blocked})}
function deleteRide(i){if(confirm('Delete this shared ride and cancel its reserved seats?'))action('delete-ride',{id:data.rides[i].id})}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const u=await api('/api/admin/login',{email:$('email').value,password:$('password').value});$('password').value='';if(!u.admin)throw Error('This account is not an administrator.');await load()}catch(e){message(e.message)}});
async function rideDetails(id){try{const r=await api('/api/admin/rides/'+id+'/details');$('rideDetailsContent').innerHTML=`<p>${esc(r.from)} → ${esc(r.to)} · ${esc(r.date)}</p><h3>Offered by</h3><p>${esc(r.driver.name)}${r.driver.email?' · '+esc(r.driver.email):''}</p><h3>Accepted by (${r.passengers.length})</h3>${r.passengers.length?'<ul>'+r.passengers.map(p=>`<li>${esc(p.name)}${p.email?' · '+esc(p.email):''}</li>`).join('')+'</ul>':'<p>No passengers have accepted yet.</p>'}`;$('rideDetailsDialog').showModal()}catch(e){message(e.message)}}
async function logout(){try{await api('/api/admin/logout',{});location.reload()}catch(e){message(e.message)}}
(async()=>{try{const u=await api('/api/admin/me');if(u.admin)await load();else message('Sign in with an administrator account.')}catch(e){message('Please sign in.')}})();
</script></html>
